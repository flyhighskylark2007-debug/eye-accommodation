<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>目の遠近調節シミュレーター</title><style>body{font-family:system-ui,'Noto Sans JP',sans-serif;background:#f3f6fa;color:#233449;margin:0;padding:20px}.app{max-width:820px;margin:auto;background:white;padding:24px;border-radius:18px;box-shadow:0 6px 24px #1a355015}h1{font-size:1.5rem;margin:0 0 8px}p{line-height:1.6}.controls{display:flex;gap:8px;margin:18px 0}button{border:1px solid #aab9c8;border-radius:9px;background:white;padding:11px 18px;cursor:pointer;font-size:1rem}button.active{background:#1765a4;color:white}svg{width:100%;height:auto;background:#f5f9fd;border-radius:12px}input[type=range]{width:100%;accent-color:#1765a4}.labels,.states{display:flex;justify-content:space-between;gap:10px}.states>div{flex:1;background:#eef3f7;border-radius:10px;padding:12px;text-align:center}.states small{display:block;color:#65768b}.status{font-weight:bold;margin:12px 0}#focusButton{background:#1765a4;color:white;width:100%;margin-top:16px}.note{font-size:.83rem;color:#65768b}.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:.85rem}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.question{background:#f3f7fc;padding:14px;border-radius:10px;margin-top:20px}@media(max-width:520px){.app{padding:15px}.states>div{padding:8px 4px;font-size:.85rem}body{padding:8px}}</style></head><body><main class="app"><h1>目の遠近調節シミュレーター</h1><p>毛様筋・チン小帯・水晶体がどのように連動するか、バーを動かして確かめよう。</p><div class="controls"><button id="far" class="active">遠くを見る</button><button id="near">近くを見る</button></div><svg id="diagram" viewBox="0 0 700 420" role="img" aria-label="目の遠近調節の模式図"><rect width="700" height="420" fill="#f5f9fd"/><path d="M160 70 Q80 210 160 350 Q380 410 580 345 Q665 210 580 75 Q380 10 160 70Z" fill="#eaf4fc" stroke="#91aec7" stroke-width="5"/><path d="M580 75 Q665 210 580 345" fill="none" stroke="#e58a86" stroke-width="10"/><path d="M155 150 Q110 210 155 270" fill="none" stroke="#8fc7e2" stroke-width="10"/><g id="muscle"></g><g id="cords"></g><ellipse id="lens" cx="290" cy="210" fill="#8dd8e9" stroke="#168eac" stroke-width="5"/><g id="rays"></g><g id="focusMark"></g><text x="210" y="35" font-size="23" fill="#8e4253">毛様筋</text><text x="540" y="40" font-size="23" fill="#ad5753">網膜</text><text x="18" y="400" font-size="19" fill="#52657a">赤：毛様筋　茶：チン小帯　青：水晶体</text></svg><p class="status" id="focusStatus" aria-live="polite"></p><label for="slider"><strong>水晶体の厚さを調節</strong> <span id="pct">20</span>%</label><input id="slider" type="range" min="0" max="100" step="1" value="20"><div class="labels"><small>薄い・毛様筋が弛緩</small><small>厚い・毛様筋が収縮</small></div><div class="states"><div><small>毛様筋</small><strong id="muscleState"></strong></div><div><small>チン小帯</small><strong id="cordState"></strong></div><div><small>水晶体</small><strong id="lensState"></strong></div></div><button id="focusButton">ピントを合わせる</button><section class="question"><strong>考えてみよう</strong><p>毛様筋が収縮すると、なぜチン小帯が緩み、水晶体が厚くなるのだろう？</p></section><p class="note">教育用模式図です。チン小帯の波打ちは張力の低下を強調した表現です。実際のチン小帯は毛様体の組織から水晶体へ伸びます。光線の屈折や眼球の形状は厳密な光学計算ではありません。</p></main><script>const $=id=>document.getElementById(id);let distance='far';const NS='http://www.w3.org/2000/svg';function add(parent,tag,attrs){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e}function cord(x1,y1,x2,y2,amp){const dx=x2-x1,dy=y2-y1;return `M ${x1} ${y1} C ${x1+dx*.3+amp} ${y1+dy*.3} ${x1+dx*.7-amp} ${y1+dy*.7} ${x2} ${y2}`}function render(){const v=+$('slider').value,t=v/100,ideal=distance==='far'?20:80;const rx=26+26*t,ry=68+26*t,mr=110-28*t,mw=22+14*t,inner=mr-mw/2;const cx=290,cy=210;const muscle=$('muscle'),cords=$('cords'),rays=$('rays'),mark=$('focusMark');for(const el of [muscle,cords,rays,mark])el.replaceChildren();add(muscle,'ellipse',{cx,cy,rx:mr,ry:mr+24,fill:'none',stroke:'#c96979','stroke-width':mw});add(muscle,'ellipse',{cx,cy,rx:mr,ry:mr+24,fill:'none',stroke:'#9e4055','stroke-width':2,'stroke-dasharray':'10 14'});for(const s of [-1,1])for(const side of [-1,1]){const x1=cx+side*inner*.62,y1=cy+s*(inner+24)*.79,x2=cx+side*rx*.68,y2=cy+s*ry*.85;add(cords,'path',{d:cord(x1,y1,x2,y2,-s*side*t*26),fill:'none',stroke:'#b98732','stroke-width':7,'stroke-linecap':'round'});add(cords,'circle',{cx:x1,cy:y1,r:4,fill:'#814d21'})}add($('diagram'),'title',{}).textContent='';$('lens').setAttribute('rx',rx);$('lens').setAttribute('ry',ry);const blur=(v-ideal)*.92;for(const r of [-52,-26,0,26,52]){const y=cy-r/52*blur;const d=distance==='far'?`M 18 ${cy+r} L ${cx} ${cy+r} L 620 ${y}`:`M 28 ${cy} L ${cx} ${cy+r} L 620 ${y}`;add(rays,'path',{d,fill:'none',stroke:'#e3aa35','stroke-width':3.2,opacity:.83})}const ok=Math.abs(v-ideal)<=3;if(ok)add(mark,'circle',{cx:620,cy,r:8,fill:'#168f70'});else add(mark,'line',{x1:620,y1:cy-Math.abs(blur),x2:620,y2:cy+Math.abs(blur),stroke:'#d76d58','stroke-width':10,'stroke-linecap':'round',opacity:.75});$('focusStatus').textContent=ok?'✓ 網膜上の1点に光が集まる':'● ピントがずれ、網膜上で光が広がる';$('focusStatus').style.color=ok?'#168f70':'#b76a29';$('pct').textContent=v;$('muscleState').textContent=t<.3?'弛緩':t>.7?'収縮':'収縮中';$('cordState').textContent=t<.3?'張る':t>.7?'緩む':'緩み中';$('lensState').textContent=t<.3?'薄い':t>.7?'厚い':'変化中'}function setDistance(d){distance=d;$('slider').value=d==='far'?20:80;$('far').classList.toggle('active',d==='far');$('near').classList.toggle('active',d==='near');render()}$('far').onclick=()=>setDistance('far');$('near').onclick=()=>setDistance('near');$('slider').oninput=render;$('focusButton').onclick=()=>{$('slider').value=distance==='far'?20:80;render()};render();</script></body></html>
